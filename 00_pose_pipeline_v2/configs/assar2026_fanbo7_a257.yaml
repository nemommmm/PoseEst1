dataset:
  name: assar2026_fanbo7_a257
  description: 2026 Assar dataset, Fanbo7 elbow straight-and-bent, A257 stereo camera.
  left_video: 2026_Assar_Data/A257/Video/cap_5_0.avi
  right_video: 2026_Assar_Data/A257/Video/cap_5_1.avi
  left_metadata: 2026_Assar_Data/A257/Video/cap_5_0.txt
  right_metadata: 2026_Assar_Data/A257/Video/cap_5_1.txt
  rotate_180: true
  sync_by: hardware_frame_id
  timestamp_format: seconds_microseconds_columns

calibration:
  camera_params: shared/camera_params_A257.npz

skt:
  use_existing_npz: false
  existing_npz: 00_pose_pipeline/runs/assar2026_fanbo7_a257_elbow_test/skt_pose_optimized.npz
  output_npz: skt_pose_optimized.npz
  model_path: 00_pose_pipeline_v2/model_weights/yolo11l-pose.pt
  confidence_threshold: 0.35
  min_pair_confidence: 0.25
  max_reprojection_px: 80.0
  max_frames:
  center_person_weight: 5.0
  triangulation:
    enforce_epipolar_constraint: true
    epipolar_soft_threshold_px: 10.0
    epipolar_soft_max_strength: 0.80
    epipolar_correction_decay_px: 3.0
    epipolar_base_px: 6.0
    epipolar_conf_gain_px: 18.0
    reprojection_base_px: 18.0
    reprojection_conf_gain_px: 42.0
    reprojection_max_px: 80.0
    min_pair_conf: 0.25
    min_disparity_px: 1.5
  temporal_window:
    enabled: true
    radius: 3
    min_support: 3
    min_stereo_quality: 0.35
    decay_sec: 0.06
    conf_floor: 0.12
    support_conf_scale: 0.75
  tracking:
    enabled: true
    full_frame_conf: 0.35
    crop_conf: 0.20
    crop_expand: 1.55
    max_misses: 8
    refull_interval: 30
    min_crop_accept_score: 0.62
    center_person_weight: 5.0
  stereo_sanity:
    enabled: true
    max_bbox_top_y_diff_px: 30.0
    bbox_height_ratio_range: [0.6, 1.67]
    max_bbox_center_y_diff_ratio: 0.2
    max_rectified_joint_y_median_px: 30.0

references:
  xsens_mvnx: "2026_Assar_Data/Xsens MVNX/Fanbo-007.mvnx"
  xsens_fair_angles:
  fastsam_trc: "2026_Assar_Data/TRC FastSAM3D/markers_Fanbo7_2026-06-16 15-46-39_7ee1db0b1b5a48a190dcc95a00599b72.trc"
  merge_trc:
  include_xsens_native: true
  trc_time_offsets_seconds:
    FastSAM3D: 7.3

offset:
  search_range_seconds: [3.0, 9.0]
  coarse_step_seconds: 0.10
  fine_window_seconds: 0.50
  fine_step_seconds: 0.01
  selection_priority: [motion_delta, angle, position]
  motion_k_seconds: 0.5
  min_pairs: 20

evaluation:
  angle_names: [RightElbow]
  k_frame_list: [1, 6, 12, 25]
  camera_smooth_window_ms: 200.0
  xsens_extra_smoothing: false
  skt_quality_filter:
    enabled: true
    min_triang_conf: 0.20
    max_epipolar_px: 10.0
    max_reprojection_px: 10.0
    joint_indices: [5, 6, 7, 8, 9, 10]
  depth_consistency_filter:
    enabled: true
    max_depth_deviation_cm: 15.0
    limb_triplets: [[5,7,9], [6,8,10]]
  max_gap_frames: 5
  anomaly_delta_deg: 30.0
  active_delta_threshold_deg: 1.0
  noise_floor_threshold_deg: 0.5
  rula_bins:
    RightElbow: [60, 100]

model_diagnostic:
  frame_stride: 4
  max_frames: 40
  jump_threshold_deg: 10.0
  jump_context_radius: 2
  candidates:
    - name: YOLOv8m-current
      kind: yolo
      model: 01_stereo_triangulation/src/yolov8m-pose.pt
      confidence_threshold: 0.35
      valid_conf_threshold: 0.25
      center_person_weight: 5.0
    - name: YOLO11n-pose
      kind: yolo
      model: 00_pose_pipeline_v2/model_weights/yolo11n-pose.pt
      confidence_threshold: 0.35
      valid_conf_threshold: 0.25
      center_person_weight: 5.0
    - name: YOLO11s-pose
      kind: yolo
      model: 00_pose_pipeline_v2/model_weights/yolo11s-pose.pt
      confidence_threshold: 0.35
      valid_conf_threshold: 0.25
      center_person_weight: 5.0
    - name: YOLO11m-pose
      kind: yolo
      model: 00_pose_pipeline_v2/model_weights/yolo11m-pose.pt
      confidence_threshold: 0.35
      valid_conf_threshold: 0.25
      center_person_weight: 5.0
    - name: YOLO11l-pose
      kind: yolo
      model: 00_pose_pipeline_v2/model_weights/yolo11l-pose.pt
      confidence_threshold: 0.35
      valid_conf_threshold: 0.25
      center_person_weight: 5.0
    - name: YOLO11x-pose
      kind: yolo
      model: 00_pose_pipeline_v2/model_weights/yolo11x-pose.pt
      enabled: false
      confidence_threshold: 0.35
      valid_conf_threshold: 0.25
      center_person_weight: 5.0
    - name: RTMPose-balanced
      kind: rtmpose
      mode: balanced
      device: cpu
      min_detection_conf: 0.20
      valid_conf_threshold: 0.25
    - name: Sapiens-pose-placeholder
      kind: sapiens
      enabled: false

filter_ablation:
  jump_threshold_deg: 10.0

segment:
  activity_lag_frames: 12
  activity_threshold_deg: 10.0
  min_duration_s: 1.5
  min_reference_rom_deg: 15.0
  merge_gap_s: 2.0
  min_valid_ratio: 0.5
  dtw_preprocess: mean_l2

scatter:
  k: 6
  targets: [SKT, FastSAM3D, XsensNative]
  active_threshold_deg:

video:
  enabled: false
  start_time_s: 0.0
  end_time_s: 30.0
  fps: 12.5
  compare_systems: [SKT, FastSAM3D]

outputs:
  runs_dir: 00_pose_pipeline_v2/runs
  run_tag: assar2026_fanbo7_a257_stage1_geometry
