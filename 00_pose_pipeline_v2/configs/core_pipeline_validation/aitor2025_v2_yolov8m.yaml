dataset:
  name: aitor2025_core_validation
  description: Blind cross-dataset validation of the frozen V2 + YOLOv8m candidate core pipeline on the 2025 recording.
  left_video: 2025_Ergonomics_Data/0_video_left.avi
  right_video: 2025_Ergonomics_Data/1_video_right.avi
  left_metadata: 2025_Ergonomics_Data/0_video_left.txt
  right_metadata: 2025_Ergonomics_Data/1_video_right.txt
  rotate_180: true
  sync_by: hardware_frame_id
  timestamp_format: seconds_microseconds_columns

calibration:
  camera_params: shared/camera_params_2025.npz

skt:
  use_existing_npz: false
  existing_npz:
  output_npz: skt_pose_optimized.npz
  model_path: 01_stereo_triangulation/src/yolov8m-pose.pt
  confidence_threshold: 0.35
  min_pair_confidence: 0.25
  max_reprojection_px: 80.0
  max_frames:
  center_person_weight: 5.0
  triangulation:
    enforce_epipolar_constraint: true
    epipolar_soft_threshold_px: 10.0
    epipolar_soft_max_strength: 0.80
    epipolar_correction_decay_px: 0.0  # 2026-09-11: frozen at 0 (disabled) -- fixed a diagnostic bug where
                                       # the shift-based confidence decay was silently a no-op; keeping it
                                       # explicitly disabled preserves the already-validated triangulation
                                       # behavior instead of silently activating an unvalidated effect.
    epipolar_base_px: 6.0
    epipolar_conf_gain_px: 18.0
    reprojection_base_px: 18.0
    reprojection_conf_gain_px: 42.0
    reprojection_max_px: 80.0
    min_pair_conf: 0.25
    min_disparity_px: 45.0  # 2026-09-11: raised from 1.5 (implied max depth 311 m, physically meaningless)
                            # to 45.0 (implied max depth ~10 m across all three calibrations), matching the
                            # already-validated physical depth gate. Zero effect on 2026 Assar data (all
                            # observed disparities are >=91px); removes the ~1% physically-impossible
                            # far-range triangulations responsible for the 2025 bone-length blowup.
  temporal_window:
    enabled: true
    radius: 3
    min_support: 3
    min_stereo_quality: 0.35
    decay_sec: 0.06
    conf_floor: 0.12
    support_conf_scale: 0.75
  tracking:
    enabled: true
    full_frame_conf: 0.35
    crop_conf: 0.20
    crop_expand: 1.55
    max_misses: 8
    refull_interval: 30
    min_crop_accept_score: 0.62
    center_person_weight: 5.0
  stereo_sanity:
    enabled: true
    # max_bbox_top_y_diff_px and max_bbox_center_y_diff_ratio removed 2026-09-11:
    # both only apply on the fallback path taken when fewer than 4 rectified joints
    # are finite, which never occurred in any of the 6 canonical datasets audited
    # (confirmed via stereo_sanity_reason -- only bbox_height_ratio/rectified_joint_y/
    # ok_rectified/missing_candidate were ever observed). Removing them falls back to
    # the StereoSanityConfig defaults (30.0px / 0.2), so this is a no-op today; it only
    # documents that the active fallback path was never exercised.
    bbox_height_ratio_range: [0.6, 1.67]
    max_rectified_joint_y_median_px: 30.0

references:
  xsens_mvnx: ../Xsens_ground_truth/Aitor-001.mvnx
  xsens_fair_angles: shared/fair_gt_angles.npz
  fastsam_trc: 03_FastSAM3D/data/easyergo_uploaded/markers_0_video_left_upright.trc
  merge_trc: ../10 Aitor/merged_output_2.trc
  include_xsens_native: true

offset:
  search_range_seconds: [0.0, 30.0]
  coarse_step_seconds: 0.10
  fine_window_seconds: 0.50
  fine_step_seconds: 0.01
  selection_priority: [motion_delta, angle, position]
  motion_k_seconds: 0.5
  min_pairs: 80

evaluation:
  angle_names: [LeftShoulder, RightShoulder, LeftElbow, RightElbow, LeftHip, RightHip, LeftKnee, RightKnee]
  k_frame_list: [1, 6, 12, 25]
  camera_smooth_window_ms: 200.0
  xsens_extra_smoothing: false
  skt_quality_filter:
    enabled: true
    min_triang_conf: 0.20
    max_epipolar_px: 10.0
    max_reprojection_px: 10.0
    joint_indices: [5, 6, 7, 8, 9, 10]
  depth_consistency_filter:
    enabled: true
    max_depth_deviation_cm: 15.0
    limb_triplets: [[5, 7, 9], [6, 8, 10]]
  max_gap_frames: 5
  anomaly_delta_deg: 30.0
  active_delta_threshold_deg: 1.0
  noise_floor_threshold_deg: 0.5
  rula_bins:
    LeftElbow: [60, 100]
    RightElbow: [60, 100]
    LeftShoulder: [20, 45, 90]
    RightShoulder: [20, 45, 90]

segment:
  activity_lag_frames: 12
  activity_threshold_deg: 10.0
  min_duration_s: 1.5
  min_reference_rom_deg: 15.0
  merge_gap_s: 2.0
  min_valid_ratio: 0.5
  dtw_preprocess: mean_l2

scatter:
  k: 6
  targets: [SKT, FastSAM3D, Merge, XsensNative]
  active_threshold_deg:

filter_ablation:
  jump_threshold_deg: 10.0

outputs:
  runs_dir: 00_pose_pipeline_v2/runs/core_pipeline_validation
  run_tag: aitor2025_v2_yolov8m_blind
