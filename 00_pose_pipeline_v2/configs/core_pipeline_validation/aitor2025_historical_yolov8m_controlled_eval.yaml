dataset:
  name: aitor2025_historical_controlled_eval
  description: Controlled re-evaluation of the historical 2025 YOLOv8m SKT output with the same evaluation settings as the frozen V2 validation.
  left_metadata: 2025_Ergonomics_Data/0_video_left.txt
  right_metadata: 2025_Ergonomics_Data/1_video_right.txt
  timestamp_format: seconds_microseconds_columns

skt:
  use_existing_npz: true
  existing_npz: 01_stereo_triangulation/results/historical_best_20260324/recovered_baseline/optimized_pose.npz

references:
  xsens_mvnx: ../Xsens_ground_truth/Aitor-001.mvnx
  xsens_fair_angles: shared/fair_gt_angles.npz
  fastsam_trc: 03_FastSAM3D/data/easyergo_uploaded/markers_0_video_left_upright.trc
  merge_trc: ../10 Aitor/merged_output_2.trc
  include_xsens_native: true

offset:
  search_range_seconds: [0.0, 30.0]
  coarse_step_seconds: 0.10
  fine_window_seconds: 0.50
  fine_step_seconds: 0.01
  selection_priority: [motion_delta, angle, position]
  motion_k_seconds: 0.5
  min_pairs: 80

evaluation:
  angle_names: [LeftShoulder, RightShoulder, LeftElbow, RightElbow, LeftHip, RightHip, LeftKnee, RightKnee]
  k_frame_list: [1, 6, 12, 25]
  camera_smooth_window_ms: 200.0
  xsens_extra_smoothing: false
  skt_quality_filter:
    enabled: true
    min_triang_conf: 0.20
    max_epipolar_px: 10.0
    max_reprojection_px: 10.0
    joint_indices: [5, 6, 7, 8, 9, 10]
  depth_consistency_filter:
    enabled: true
    max_depth_deviation_cm: 15.0
    limb_triplets: [[5, 7, 9], [6, 8, 10]]
  max_gap_frames: 5
  anomaly_delta_deg: 30.0
  active_delta_threshold_deg: 1.0
  noise_floor_threshold_deg: 0.5
  rula_bins:
    LeftElbow: [60, 100]
    RightElbow: [60, 100]
    LeftShoulder: [20, 45, 90]
    RightShoulder: [20, 45, 90]

outputs:
  runs_dir: 00_pose_pipeline_v2/runs/core_pipeline_validation
  run_tag: aitor2025_historical_yolov8m_controlled_eval
