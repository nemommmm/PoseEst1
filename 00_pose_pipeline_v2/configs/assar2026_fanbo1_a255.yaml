dataset:
  name: assar2026_fanbo1_a255
  description: 2026 Assar dataset, Fanbo1 walking forward, A255 stereo camera.
  left_video: 2026_Assar_Data/A255/Video/cap_0_0.avi
  right_video: 2026_Assar_Data/A255/Video/cap_0_1.avi
  left_metadata: 2026_Assar_Data/A255/Video/cap_0_0.txt
  right_metadata: 2026_Assar_Data/A255/Video/cap_0_1.txt
  rotate_180: true
  sync_by: hardware_frame_id
  timestamp_format: seconds_microseconds_columns

calibration:
  camera_params: shared/camera_params_A255.npz

skt:
  use_existing_npz: false
  existing_npz: 00_pose_pipeline/runs/2026_assar_skt_reconstruction_new_calib/A255_cap00/skt_pose_optimized.npz
  output_npz: skt_pose_optimized.npz
  model_path: 00_pose_pipeline_v2/model_weights/yolo11l-pose.pt
  confidence_threshold: 0.35
  min_pair_confidence: 0.25
  max_reprojection_px: 80.0
  max_frames:
  triangulation:
    enforce_epipolar_constraint: true
    epipolar_soft_threshold_px: 10.0
    epipolar_soft_max_strength: 0.80
    epipolar_correction_decay_px: 3.0
    epipolar_base_px: 6.0
    epipolar_conf_gain_px: 18.0
    reprojection_base_px: 18.0
    reprojection_conf_gain_px: 42.0
    reprojection_max_px: 80.0
    min_pair_conf: 0.25
    min_disparity_px: 1.5
  temporal_window:
    enabled: true
    radius: 3
    min_support: 3
    min_stereo_quality: 0.35
    decay_sec: 0.06
    conf_floor: 0.12
    support_conf_scale: 0.75
  tracking:
    enabled: true
    full_frame_conf: 0.35
    crop_conf: 0.20
    crop_expand: 1.55
    max_misses: 8
    refull_interval: 30
    min_crop_accept_score: 0.62
    center_person_weight: 5.0
  stereo_sanity:
    enabled: true
    max_bbox_top_y_diff_px: 30.0
    bbox_height_ratio_range: [0.6, 1.67]
    max_bbox_center_y_diff_ratio: 0.2
    max_rectified_joint_y_median_px: 30.0

references:
  xsens_mvnx: 2026_Assar_Data/Xsens MVNX/Fanbo-001.mvnx
  xsens_fair_angles:
  fastsam_trc: 2026_Assar_Data/TRC FastSAM3D/markers_Fanbo1_2026-06-16 15-18-30_ff1bf8dc772c4dc68518080f7cf4bc5d.trc
  merge_trc:
  include_xsens_native: true
  # From A25_note.md: place the Webcam/FastSAM3D timeline at about 11 s on the A255 stereo timeline.
  trc_time_offsets_seconds:
    FastSAM3D: 11.0

offset:
  # A25_note.md gives an approximate 11 s offset for Fanbo1.
  # The walking action is weak for unconstrained automatic synchronization, so search locally first.
  search_range_seconds: [8.0, 14.0]
  coarse_step_seconds: 0.10
  fine_window_seconds: 0.50
  fine_step_seconds: 0.01
  selection_priority: [motion_delta, angle, position]
  motion_k_seconds: 0.5
  min_pairs: 40

evaluation:
  angle_names: [LeftShoulder, RightShoulder, LeftElbow, RightElbow, LeftHip, RightHip, LeftKnee, RightKnee]
  k_frame_list: [1, 6, 12, 25]
  camera_smooth_window_ms: 200.0
  xsens_extra_smoothing: false
  skt_quality_filter:
    enabled: true
    min_triang_conf: 0.20
    max_epipolar_px: 10.0
    max_reprojection_px: 10.0
    joint_indices: [5, 6, 7, 8, 9, 10]
  depth_consistency_filter:
    enabled: true
    max_depth_deviation_cm: 15.0
    # Only check arm joints (shoulder-elbow-wrist); legs have large natural depth swings during walking.
    limb_triplets: [[5,7,9], [6,8,10]]
  max_gap_frames: 5
  anomaly_delta_deg: 30.0
  active_delta_threshold_deg: 1.0
  noise_floor_threshold_deg: 0.5
  rula_bins:
    LeftElbow: [60, 100]
    RightElbow: [60, 100]
    LeftShoulder: [20, 45, 90]
    RightShoulder: [20, 45, 90]

segment:
  activity_lag_frames: 12
  activity_threshold_deg: 10.0
  min_duration_s: 1.5
  min_reference_rom_deg: 15.0
  merge_gap_s: 2.0
  min_valid_ratio: 0.5
  dtw_preprocess: mean_l2

scatter:
  k: 6
  targets: [SKT, FastSAM3D, XsensNative]
  active_threshold_deg:

video:
  enabled: false
  start_time_s: 0.0
  end_time_s: 20.0
  fps: 12.5
  compare_systems: [SKT, FastSAM3D]

outputs:
  runs_dir: 00_pose_pipeline_v2/runs
  run_tag: assar2026_fanbo1_a255_stage1_geometry
